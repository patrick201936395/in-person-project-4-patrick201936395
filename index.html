<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Ruan - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="navbar" aria-label="Main navigation">
        <button class="nav-toggle" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul id="nav-menu" class="nav-menu">
            <li><a class="nav-link" href="#about">About</a></li>
            <li><a class="nav-link" href="#skills">Skills</a></li>
            <li><a class="nav-link" href="#projects">Projects</a></li>
            <li><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div id="generated-header">
        </div>

        <section id="about">
            <h2>About Me</h2>
            <p id="bio"></p>
            <p><a id="owner-email"></a></p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>
            <ul id="generated-skills" class="skills-list"></ul>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <div class="filter-buttons" aria-label="Project categories">
                <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">All Projects</button>
                <button class="filter-btn" type="button" data-filter="frontend" aria-pressed="false">Frontend</button>
                <button class="filter-btn" type="button" data-filter="data" aria-pressed="false">Data Analysis</button>
                <button class="filter-btn" type="button" data-filter="design" aria-pressed="false">Design</button>
            </div>
            <div id="generated-projects" class="projects-grid"></div>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Let's work together! This is a practice form; messages are not sent.</p>

            <form id="contact-form" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" minlength="2" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">

                <label for="start-date">Preferred Start Date:</label>
                <input type="date" id="start-date" name="start-date">

                <label for="budget">Budget (USD):</label>
                <input type="number" id="budget" name="budget" min="0" step="100">

                <fieldset>
                    <legend>Preferred Contact Method:</legend>
                    <div class="form-row">
                        <input type="radio" id="contact-email" name="contact" value="email">
                        <label for="contact-email">Email</label>
                    </div>
                    <div class="form-row">
                        <input type="radio" id="contact-phone" name="contact" value="phone">
                        <label for="contact-phone">Phone</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Project Timeline:</legend>
                    <div class="form-row">
                        <input type="checkbox" id="asap" name="timeline" value="asap">
                        <label for="asap">ASAP</label>
                    </div>
                    <div class="form-row">
                        <input type="checkbox" id="flexible" name="timeline" value="flexible">
                        <label for="flexible">Flexible</label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
                </div>

                <button type="submit">Send Message</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="display.js"></script>
    <script src="script.js"></script>
</body>
</html>
